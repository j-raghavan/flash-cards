# Render Blueprint for Phase 0 (free tier). See docs/adr/0004-phased-hosting.md.
# Not yet validated against a live Render account.
services:
  - type: web
    name: flash-cards
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FLASHCARDS_ENVIRONMENT
        value: production
      - key: FLASHCARDS_INVITE_ONLY
        value: "true"
