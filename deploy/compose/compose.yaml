# SPDX-License-Identifier: AGPL-3.0-only
#
# Production-style self-hosting stack: Postgres 16, a one-shot migration job, the
# API and the web app. The web service serves the app and forwards /api to the
# API, so the whole site is one origin. An optional Caddy reverse proxy (profile
# "proxy") terminates HTTPS in front of it.
# Guide: docs/runbooks/self-hosting-compose.md
#
#   cd deploy/compose
#   cp .env.example .env        # then edit .env
#   docker compose up -d --build                    # site on 127.0.0.1:8000
#   docker compose --profile proxy up -d --build    # plus Caddy on :80/:443
#
# Secrets live only in .env (git-ignored). Nothing in this file is a secret.

name: flashcards

x-api-image: &api-image
  image: flash-cards-api:${FLASHCARDS_IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile

x-api-env: &api-env
  # Built from the database service below. Edit this line (not .env) to point
  # the stack at an external Postgres instead.
  FLASHCARDS_DATABASE_URL: postgresql://flashcards:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/flashcards

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashcards
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # A named volume by default, or the host directory FLASHCARDS_PGDATA.
      # Changing it on an existing install points Postgres at a different
      # (empty) database: move the data with a backup and restore.sh instead.
      - ${FLASHCARDS_PGDATA:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards -d flashcards"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No published port: only services on the backend network reach Postgres.
    networks: [backend]

  # Scheduled database backups (deploy/compose/backup.sh): a verified pg_dump
  # every FLASHCARDS_BACKUP_INTERVAL_HOURS into FLASHCARDS_BACKUP_DIR, keeping
  # the newest FLASHCARDS_BACKUP_KEEP. upgrade.sh also takes one before upgrading.
  # Keep its image's major version the same as db's: pg_dump must match.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP: ${FLASHCARDS_BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${FLASHCARDS_BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ${FLASHCARDS_BACKUP_DIR:-./backups}:/backups
    # Unhealthy (visible in `docker compose ps`) when the newest backup is older
    # than two intervals: backups are failing.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          [ -n "$$(find /backups -maxdepth 1 -name 'flashcards-*.dump'
          -mmin -$$((BACKUP_INTERVAL_HOURS * 120)) | head -n 1)" ]
      interval: 1h
      timeout: 10s
      start_period: 15m
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  # Applies Alembic migrations, then exits. The API starts only after it succeeds,
  # so a failed migration stops the rollout instead of serving an old schema.
  migrate:
    <<: *api-image
    env_file: .env
    environment:
      <<: *api-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *api-image
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      # Trust X-Forwarded-* from the web service, which sets them. Safe only
      # because the API publishes no port and is reachable only on the compose
      # networks.
      FORWARDED_ALLOW_IPS: "*"
    # Migrations are the migrate service's job, so the API skips the image
    # entrypoint (which would run them again) and starts the server directly.
    command: ["uvicorn", "flashcards.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No published port: the web service forwards /api here.
    networks: [backend, frontend]

  # The web app (static files) and the /api reverse proxy, in one Caddy image
  # built from apps/web/Dockerfile (configuration: apps/web/Caddyfile). It sends
  # the Content-Security-Policy and the other security headers.
  web:
    image: flash-cards-web:${FLASHCARDS_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Plain HTTP, loopback only by default: put an HTTPS reverse proxy in front
      # (the proxy profile below, or one already on the host). FLASHCARDS_HTTP_BIND
      # =0.0.0.0 serves the local network directly (runbook: "Home network over
      # plain HTTP").
      - "${FLASHCARDS_HTTP_BIND:-127.0.0.1}:${FLASHCARDS_HTTP_PORT:-8000}:8080"
    networks: [frontend]

  # Optional HTTPS front end: docker compose --profile proxy up -d
  # Caddy obtains and renews a certificate for FLASHCARDS_DOMAIN automatically
  # and forwards everything to the web service.
  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      # Set FLASHCARDS_DOMAIN in .env. It cannot be marked required here without
      # breaking stacks that do not use this profile; left unset, Caddy serves
      # localhost with its internal (untrusted) certificate.
      FLASHCARDS_DOMAIN: ${FLASHCARDS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # Internal: no route to the internet. The API reaches the AI provider and SMTP
  # through the frontend network.
  backend:
    internal: true
  frontend:
