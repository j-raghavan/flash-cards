[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcards-api"
version = "0.0.1"
description = "Flash-Cards API"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov"

# Coverage gate: 97% of lines AND branches, for the whole package. The build fails below it.
[tool.coverage.run]
branch = true
source = ["flashcards"]

[tool.coverage.report]
fail_under = 97
show_missing = true
# Only constructs that cannot execute: type-checking imports and Protocol method stubs.
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

# Architecture rules (DDD / Clean Architecture), enforced in CI by import-linter.
[tool.importlinter]
root_package = "flashcards"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward: api -> adapters -> application -> domain"
type = "layers"
layers = [
  "flashcards.api",
  "flashcards.adapters",
  "flashcards.application",
  "flashcards.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application layers are framework-free"
type = "forbidden"
source_modules = ["flashcards.domain", "flashcards.application"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "uvicorn",
  "pydantic",
  "pydantic_settings",
  "sqlalchemy",
  "flashcards.adapters",
  "flashcards.api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]

# Tests use asserts (S101) and literal fixture passwords/tokens (S105/S106);
# these are not production secrets.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
