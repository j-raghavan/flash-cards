[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcards-api"
version = "0.0.1"
description = "Flash-Cards API"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.121",  # Depends(..., scope="function")
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "fsrs>=6,<7",
  "pymupdf>=1.24",
  "puremagic>=2.1",
  "anthropic>=2.6,<3",
  "httpx>=0.27",
]

[project.scripts]
flashcards = "flashcards.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "testcontainers>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov"
asyncio_mode = "auto"

# Coverage gate: 97% of lines AND branches, for the whole package. The build fails below it.
[tool.coverage.run]
branch = true
source = ["flashcards"]

[tool.coverage.report]
fail_under = 97
show_missing = true
# Only constructs that cannot execute: type-checking imports and Protocol method stubs.
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$", "if __name__ == .__main__.:"]

# Architecture rules (DDD / Clean Architecture), enforced in CI by import-linter.
[tool.importlinter]
root_package = "flashcards"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward: api -> adapters -> application -> domain"
type = "layers"
layers = [
  "flashcards.api",
  "flashcards.adapters",
  "flashcards.application",
  "flashcards.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application layers are framework-free"
type = "forbidden"
source_modules = ["flashcards.domain", "flashcards.application"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "uvicorn",
  "pydantic",
  "pydantic_settings",
  "sqlalchemy",
  "flashcards.adapters",
  "flashcards.api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ANN401 bans the literal typing.Any in annotations (project rule: strongly typed,
# never Any). It is syntactic, so it never trips on Pydantic/FastAPI machinery.
select = ["E", "F", "I", "UP", "B", "S", "SIM", "ANN401"]

# FastAPI's dependency/parameter markers are meant to be called in argument
# defaults, so they are not the mutable-default footgun B008 warns about.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Body",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

# Tests use asserts (S101) and literal fixture passwords/tokens (S105/S106);
# these are not production secrets.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

# PyMuPDF ships py.typed but with incomplete annotations (many Any/untyped
# callables); treat it as untyped so strict's no-untyped-call does not fire on it.
[[tool.mypy.overrides]]
module = ["pymupdf.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
